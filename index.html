<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바쿠토쿠 v0.1 - 실시간 외국어 회화 & 표현 코치</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    .wave-pulse {
      animation: wave 1.2s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col h-screen overflow-hidden">

  <!-- Header Section -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm z-20 flex-shrink-0">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center text-white shadow-md">
        <i class="fa-solid fa-comments text-lg"></i>
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-lg font-bold text-slate-800 leading-tight">바쿠토쿠</h1>
          <span class="bg-slate-100 text-slate-600 text-[11px] font-semibold px-1.5 py-0.5 rounded border border-slate-200">v0.1</span>
          <span id="currentLangBadge" class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-indigo-100 flex items-center gap-1">
            <span>🇺🇸</span> 영어 (US)
          </span>
          <span id="tutorBadge" class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-indigo-100 flex items-center gap-1">
            <i class="fa-solid fa-mars text-[11px]" id="tutorIcon"></i>
            <span id="tutorNameText">튜터: James</span>
          </span>
        </div>
        <p class="text-xs text-slate-500">실시간 회화 & 한국어 질문 표현 가이드</p>
      </div>
    </div>

    <!-- Right Header Controls -->
    <div class="flex items-center space-x-2">
      <button id="clearChatBtn" onclick="clearAllChat()" title="대화 내용 지우기" class="p-2.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-all cursor-pointer">
        <i class="fa-regular fa-trash-can text-base"></i>
      </button>
      <button id="openSettingsBtn" onclick="openSettings()" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl text-sm font-medium transition-all shadow-sm cursor-pointer">
        <i class="fa-solid fa-gear text-slate-500"></i>
        <span>설정</span>
      </button>
    </div>
  </header>

  <!-- Main Chat Container -->
  <main id="chatContainer" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 space-y-4 max-w-3xl w-full mx-auto">
    <!-- Welcome Guide Banner -->
    <div class="bg-gradient-to-r from-indigo-50 to-purple-50 rounded-2xl p-4 border border-indigo-100/70 shadow-sm text-sm text-slate-700 flex items-start gap-3">
      <div class="text-indigo-600 mt-0.5"><i class="fa-solid fa-wand-magic-sparkles text-lg"></i></div>
      <div class="space-y-1">
        <p class="font-semibold text-indigo-900">편하게 외국어로 말하거나 한국어로 물어보세요!</p>
        <p class="text-slate-600 text-xs leading-relaxed">
          외국어로 말문이 막힐 땐 <strong>"이럴 때 영어로 뭐라고 해?"</strong> 처럼 한국어로 물어보세요. 적절한 표현과 발음 가이드를 친절하게 코칭해드립니다.
        </p>
      </div>
    </div>
  </main>

  <!-- Footer Input Area -->
  <footer class="bg-white border-t border-slate-200 p-3 md:p-4 z-20 flex-shrink-0">
    <div class="max-w-3xl mx-auto space-y-2">
      <div class="flex items-center justify-between text-xs px-1 text-slate-500">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500" id="connectionStatusDot"></span>
          <span id="speechStatusText">음성 또는 텍스트로 대화하세요</span>
        </div>
        <div class="flex items-center gap-1 bg-slate-100 p-0.5 rounded-lg border border-slate-200">
          <button type="button" id="micLangForeign" onclick="setMicLanguage('foreign')" class="px-2 py-0.5 rounded text-xs font-medium transition bg-white shadow-sm text-indigo-600 cursor-pointer">
            외국어로 말하기
          </button>
          <button type="button" id="micLangKorean" onclick="setMicLanguage('korean')" class="px-2 py-0.5 rounded text-xs font-medium transition text-slate-500 hover:text-slate-700 cursor-pointer">
            한국어로 묻기
          </button>
        </div>
      </div>

      <form id="messageForm" onsubmit="event.preventDefault(); handleSubmitMessage();" class="flex items-center gap-2">
        <button type="button" id="micBtn" onclick="toggleMic()" title="음성 인식 시작/종료" class="w-11 h-11 flex-shrink-0 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-all focus:outline-none cursor-pointer">
          <i class="fa-solid fa-microphone text-base" id="micIcon"></i>
        </button>

        <div class="relative flex-1">
          <input 
            type="text" 
            id="textInput" 
            class="w-full bg-slate-100 border border-transparent focus:border-indigo-400 focus:bg-white text-slate-800 placeholder-slate-400 text-sm rounded-xl px-4 py-3 outline-none transition"
            placeholder="대화를 시작하세요 (잘 모를 땐 한국어로 질문!)"
            autocomplete="off"
          />
        </div>

        <button type="submit" id="sendBtn" class="w-11 h-11 flex-shrink-0 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center transition-all shadow-md cursor-pointer">
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </form>
    </div>
  </footer>

  <!-- Settings Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100" id="settingsModalContent" onclick="event.stopPropagation()">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-sliders text-indigo-600"></i>
          <h2 class="font-bold text-slate-800 text-base">바쿠토쿠 설정</h2>
          <span class="bg-indigo-50 text-indigo-600 text-[10px] font-bold px-1.5 py-0.5 rounded border border-indigo-100">v0.1</span>
        </div>
        <button type="button" onclick="closeSettings()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg cursor-pointer">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-5 space-y-5 max-h-[75vh] overflow-y-auto custom-scrollbar">
        <!-- 목표 언어 설정 -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-2">대화할 외국어 선택</label>
          <div class="grid grid-cols-2 gap-2" id="langOptionsGrid"></div>
        </div>

        <!-- 성별 설정 -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-semibold text-slate-700">AI 튜터 성별 & 이름</label>
            <span id="activeTutorPreview" class="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-100">
              James (제임스)
            </span>
          </div>
          <div class="grid grid-cols-2 gap-2" id="genderContainer">
            <button type="button" id="genderMaleBtn" onclick="selectGender('male')" class="py-2.5 px-3 rounded-xl border border-indigo-500 bg-indigo-50 text-indigo-700 font-semibold text-xs flex items-center justify-center gap-2 transition cursor-pointer">
              <i class="fa-solid fa-mars text-indigo-600"></i>
              <span>남성 튜터</span>
            </button>
            <button type="button" id="genderFemaleBtn" onclick="selectGender('female')" class="py-2.5 px-3 rounded-xl border border-slate-200 text-slate-600 font-medium text-xs flex items-center justify-center gap-2 hover:bg-slate-50 transition cursor-pointer">
              <i class="fa-solid fa-venus text-pink-500"></i>
              <span>여성 튜터</span>
            </button>
          </div>
        </div>

        <!-- 발음 배속 -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="speedRange" class="text-xs font-semibold text-slate-700">발음 배속 (말하기 속도)</label>
            <span id="speedValueLabel" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-100">1.0x (보통)</span>
          </div>
          <div class="space-y-1">
            <input type="range" id="speedRange" min="0.6" max="1.4" step="0.1" value="1.0" oninput="handleSpeedChange(this.value)" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
          </div>
        </div>

        <!-- 대화 기억 범위 -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="contextRange" class="text-xs font-semibold text-slate-700">AI 대화 기억 범위 (연속성)</label>
            <span id="contextValueLabel" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-100">최근 14개 턴 (균형)</span>
          </div>
          <div class="space-y-1">
            <input type="range" id="contextRange" min="6" max="30" step="2" value="14" oninput="handleContextChange(this.value)" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
          </div>
        </div>

        <!-- 시나리오 -->
        <div>
          <label for="scenarioSelect" class="block text-xs font-semibold text-slate-700 mb-2">대화 상황 / 시나리오</label>
          <select id="scenarioSelect" class="w-full bg-slate-100 border border-slate-200 text-slate-700 text-xs rounded-xl p-2.5 outline-none focus:border-indigo-500">
            <option value="daily">일상 자유 프리토킹 (Free Conversation)</option>
            <option value="travel">여행 & 공항/호텔 체크인</option>
            <option value="cafe">카페 & 식당 주문하기</option>
            <option value="business">비즈니스 회의 & 이메일</option>
          </select>
        </div>

        <!-- 학습자 수준 -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-2">나의 외국어 실력</label>
          <div class="grid grid-cols-3 gap-2" id="levelContainer">
            <button type="button" onclick="selectLevel('초급')" class="level-btn py-2 text-xs rounded-xl border border-indigo-500 bg-indigo-50 text-indigo-700 font-medium cursor-pointer">초급</button>
            <button type="button" onclick="selectLevel('중급')" class="level-btn py-2 text-xs rounded-xl border border-slate-200 text-slate-600 font-medium hover:bg-slate-50 cursor-pointer">중급</button>
            <button type="button" onclick="selectLevel('고급')" class="level-btn py-2 text-xs rounded-xl border border-slate-200 text-slate-600 font-medium hover:bg-slate-50 cursor-pointer">고급</button>
          </div>
        </div>

        <!-- API Key -->
        <div class="pt-2 border-t border-slate-100">
          <div class="flex items-center justify-between mb-1.5">
            <label for="apiKeyInput" class="text-xs font-semibold text-slate-700">Gemini API 키 (필수)</label>
            <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-[10px] text-indigo-600 hover:underline bg-indigo-50 px-2 py-0.5 rounded font-medium flex items-center gap-1">
              <span>무료 키 발급</span>
            </a>
          </div>
          <input 
            type="password" 
            id="apiKeyInput" 
            placeholder="AI Studio에서 발급받은 API Key 입력" 
            class="w-full bg-slate-100 border border-slate-200 text-slate-700 text-xs rounded-xl p-2.5 outline-none focus:border-indigo-500 font-mono"
          />
        </div>
      </div>

      <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex justify-end">
        <button type="button" onclick="saveSettings()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shadow cursor-pointer">
          설정 저장하기
        </button>
      </div>
    </div>
  </div>

  <script>
    const LANGUAGES = [
      { id: 'en', code: 'en-US', name: '영어', flag: '🇺🇸', label: '영어 (US)' },
      { id: 'ja', code: 'ja-JP', name: '일본어', flag: '🇯🇵', label: '일본어' },
      { id: 'zh', code: 'zh-CN', name: '중국어', flag: '🇨🇳', label: '중국어 (간체)' },
      { id: 'es', code: 'es-ES', name: '스페인어', flag: '🇪🇸', label: '스페인어' },
      { id: 'fr', code: 'fr-FR', name: '프랑스어', flag: '🇫🇷', label: '프랑스어' },
      { id: 'de', code: 'de-DE', name: '독일어', flag: '🇩🇪', label: '독일어' }
    ];

    const AGENT_NAMES = {
      en: { male: { display: 'James (제임스)', name: 'James' }, female: { display: 'Emma (엠마)', name: 'Emma' } },
      ja: { male: { display: 'Ren (렌)', name: 'Ren' }, female: { display: 'Yui (유이)', name: 'Yui' } },
      zh: { male: { display: 'Wei (웨이)', name: 'Wei' }, female: { display: 'Fang (팡)', name: 'Fang' } },
      es: { male: { display: 'Alejandro (알레한드로)', name: 'Alejandro' }, female: { display: 'Lucía (루시아)', name: 'Lucía' } },
      fr: { male: { display: 'Thomas (토마)', name: 'Thomas' }, female: { display: 'Emma (엠마)', name: 'Emma' } },
      de: { male: { display: 'Lukas (루카스)', name: 'Lukas' }, female: { display: 'Mia (미아)', name: 'Mia' } }
    };

    function getStoredKey() {
      try { return localStorage.getItem('bakutoku_gemini_api_key') || ''; } 
      catch (e) { return ''; }
    }
    function setStoredKey(key) {
      try { localStorage.setItem('bakutoku_gemini_api_key', key); } 
      catch (e) {}
    }

    const appState = {
      lang: LANGUAGES[0],
      gender: 'male',
      speechRate: 1.0,
      contextTurns: 14,
      scenario: 'daily',
      level: '초급',
      apiKey: getStoredKey(),
      micMode: 'foreign',
      isListening: false,
      history: []
    };

    let recognition = null;

    function getCurrentAgent() {
      const langConfig = AGENT_NAMES[appState.lang.id] || AGENT_NAMES.en;
      return langConfig[appState.gender] || langConfig.male;
    }

    window.openSettings = function() {
      document.getElementById('settingsModal').classList.remove('hidden');
      document.getElementById('apiKeyInput').value = appState.apiKey || '';
      renderLangOptions();
    };

    window.closeSettings = function() {
      document.getElementById('settingsModal').classList.add('hidden');
    };

    window.saveSettings = function() {
      appState.scenario = document.getElementById('scenarioSelect').value;
      const key = document.getElementById('apiKeyInput').value.trim();
      appState.apiKey = key;
      setStoredKey(key);
      closeSettings();
      const agent = getCurrentAgent();
      appendSystemMessage(`설정이 업데이트되었습니다: [튜터: ${agent.display} (${appState.lang.name}) | 배속 ${appState.speechRate}x | 기억 ${appState.contextTurns}턴 | 수준: ${appState.level}]`);
    };

    window.handleSpeedChange = function(val) {
      appState.speechRate = parseFloat(val);
      document.getElementById('speedValueLabel').textContent = `${parseFloat(val).toFixed(1)}x`;
    };

    window.handleContextChange = function(val) {
      appState.contextTurns = parseInt(val, 10);
      document.getElementById('contextValueLabel').textContent = `최근 ${val}개 턴`;
    };

    window.selectGender = function(gender) {
      appState.gender = gender;
      const mBtn = document.getElementById('genderMaleBtn');
      const fBtn = document.getElementById('genderFemaleBtn');
      if (gender === 'female') {
        mBtn.className = 'py-2.5 px-3 rounded-xl border border-slate-200 text-slate-600 font-medium text-xs flex items-center justify-center gap-2 hover:bg-slate-50 transition cursor-pointer';
        fBtn.className = 'py-2.5 px-3 rounded-xl border border-pink-500 bg-pink-50 text-pink-700 font-semibold text-xs flex items-center justify-center gap-2 transition cursor-pointer';
      } else {
        fBtn.className = 'py-2.5 px-3 rounded-xl border border-slate-200 text-slate-600 font-medium text-xs flex items-center justify-center gap-2 hover:bg-slate-50 transition cursor-pointer';
        mBtn.className = 'py-2.5 px-3 rounded-xl border border-indigo-500 bg-indigo-50 text-indigo-700 font-semibold text-xs flex items-center justify-center gap-2 transition cursor-pointer';
      }
      updateTutorUI();
    };

    window.selectLevel = function(lvl) {
      appState.level = lvl;
      document.querySelectorAll('.level-btn').forEach(btn => {
        if (btn.textContent.includes(lvl)) btn.className = 'level-btn py-2 text-xs rounded-xl border border-indigo-500 bg-indigo-50 text-indigo-700 font-medium cursor-pointer';
        else btn.className = 'level-btn py-2 text-xs rounded-xl border border-slate-200 text-slate-600 font-medium hover:bg-slate-50 cursor-pointer';
      });
    };

    window.setMicLanguage = function(mode) {
      appState.micMode = mode;
      const fEl = document.getElementById('micLangForeign');
      const kEl = document.getElementById('micLangKorean');
      if (mode === 'foreign') {
        fEl.className = 'px-2 py-0.5 rounded text-xs font-medium transition bg-white shadow-sm text-indigo-600 cursor-pointer';
        kEl.className = 'px-2 py-0.5 rounded text-xs font-medium transition text-slate-500 hover:text-slate-700 cursor-pointer';
      } else {
        kEl.className = 'px-2 py-0.5 rounded text-xs font-medium transition bg-white shadow-sm text-indigo-600 cursor-pointer';
        fEl.className = 'px-2 py-0.5 rounded text-xs font-medium transition text-slate-500 hover:text-slate-700 cursor-pointer';
      }
      if (appState.isListening) { stopListening(); startListening(); }
    };

    function renderLangOptions() {
      const grid = document.getElementById('langOptionsGrid');
      grid.innerHTML = '';
      LANGUAGES.forEach(lang => {
        const isSelected = lang.id === appState.lang.id;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `p-2.5 rounded-xl border text-xs flex items-center gap-2 transition cursor-pointer ${isSelected ? 'border-indigo-600 bg-indigo-50 text-indigo-700 font-bold' : 'border-slate-200 text-slate-700 hover:bg-slate-50'}`;
        btn.innerHTML = `<span class="text-base">${lang.flag}</span> <span>${lang.name}</span>`;
        btn.onclick = () => { appState.lang = lang; renderLangOptions(); updateHeaderBadge(); updateTutorUI(); };
        grid.appendChild(btn);
      });
    }

    function updateHeaderBadge() {
      document.getElementById('currentLangBadge').innerHTML = `<span>${appState.lang.flag}</span> ${appState.lang.label}`;
      document.getElementById('micLangForeign').textContent = `${appState.lang.name}로 말하기`;
    }

    function updateTutorUI() {
      const agent = getCurrentAgent();
      document.getElementById('tutorNameText').textContent = `튜터: ${agent.name}`;
      document.getElementById('activeTutorPreview').textContent = agent.display;
      
      const tIcon = document.getElementById('tutorIcon');
      const tBadge = document.getElementById('tutorBadge');
      if (appState.gender === 'female') {
        tIcon.className = 'fa-solid fa-venus text-[11px]';
        tBadge.className = 'bg-pink-50 text-pink-700 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-pink-100 flex items-center gap-1';
      } else {
        tIcon.className = 'fa-solid fa-mars text-[11px]';
        tBadge.className = 'bg-indigo-50 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-indigo-100 flex items-center gap-1';
      }
    }

    function initSpeechRecognition() {
      try {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.onstart = () => {
            appState.isListening = true;
            document.getElementById('micBtn').classList.add('bg-red-500', 'text-white', 'wave-pulse');
            document.getElementById('speechStatusText').textContent = '듣고 있습니다... 말씀해주세요';
          };
          recognition.onresult = (e) => {
            document.getElementById('textInput').value = e.results[0][0].transcript;
            stopListening();
            handleSubmitMessage();
          };
          recognition.onerror = () => {
            stopListening();
            document.getElementById('speechStatusText').textContent = '음성 인식 실패 (텍스트로 입력해주세요)';
          };
          recognition.onend = () => stopListening();
        }
      } catch (e) {}
    }

    window.toggleMic = function() { appState.isListening ? stopListening() : startListening(); };
    window.startListening = function() {
      if (!recognition) return;
      recognition.lang = appState.micMode === 'korean' ? 'ko-KR' : appState.lang.code;
      try { recognition.start(); } catch (e) {}
    };
    window.stopListening = function() {
      appState.isListening = false;
      const btn = document.getElementById('micBtn');
      btn.classList.remove('bg-red-500', 'text-white', 'wave-pulse');
      btn.classList.add('bg-slate-100', 'text-slate-700');
      document.getElementById('speechStatusText').textContent = '음성 또는 텍스트로 대화하세요';
      if (recognition) { try { recognition.stop(); } catch (e) {} }
    };

    function speakText(text, langCode, btnEl) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = langCode || appState.lang.code;
        utterance.rate = appState.speechRate;
        const voices = window.speechSynthesis.getVoices();
        const langVoices = voices.filter(v => v.lang.replace('_', '-').startsWith(utterance.lang.substring(0, 2)));
        if (langVoices.length > 0) utterance.voice = langVoices[0];
        
        if (btnEl) {
          const icon = btnEl.querySelector('i');
          const orig = icon.className;
          icon.className = 'fa-solid fa-volume-high text-indigo-600 animate-pulse';
          utterance.onend = () => icon.className = orig;
        }
        window.speechSynthesis.speak(utterance);
      } catch (e) {}
    }

    function appendUserMessage(text) {
      const c = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'flex justify-end';
      div.innerHTML = `<div class="bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 max-w-[85%] text-sm shadow-sm leading-relaxed">${escapeHtml(text)}</div>`;
      c.appendChild(div);
      c.scrollTop = c.scrollHeight;
    }

    function appendSystemMessage(text) {
      const c = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'text-center my-2';
      div.innerHTML = `<span class="inline-block bg-slate-200/80 text-slate-700 text-xs px-3.5 py-1.5 rounded-full font-medium shadow-sm">${text}</span>`;
      c.appendChild(div);
      c.scrollTop = c.scrollHeight;
    }

    function createTypingIndicator() {
      const c = document.getElementById('chatContainer');
      const id = 'typing-' + Date.now();
      const div = document.createElement('div');
      div.id = id;
      div.className = 'flex items-start gap-2.5';
      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs flex-shrink-0 font-bold">AI</div>
        <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-slate-400 animate-bounce"></span>
          <span class="w-2 h-2 rounded-full bg-slate-400 animate-bounce [animation-delay:0.2s]"></span>
          <span class="w-2 h-2 rounded-full bg-slate-400 animate-bounce [animation-delay:0.4s]"></span>
        </div>`;
      c.appendChild(div);
      c.scrollTop = c.scrollHeight;
      return id;
    }

    function removeTypingIndicator(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function appendAiResponse(data) {
      const c = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'flex items-start gap-2.5 max-w-[92%] md:max-w-[85%]';
      const agent = getCurrentAgent();
      const isF = appState.gender === 'female';

      let html = `
        <div class="w-9 h-9 rounded-full ${isF ? 'bg-gradient-to-tr from-pink-500 to-rose-400' : 'bg-gradient-to-tr from-indigo-600 to-indigo-400'} text-white flex flex-col items-center justify-center text-[10px] flex-shrink-0 font-bold shadow-sm mt-0.5">
          <i class="fa-solid ${isF ? 'fa-user' : 'fa-user-tie'} text-xs"></i>
          <span class="text-[9px] leading-tight">${agent.name.substring(0, 3)}</span>
        </div>
        <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-sm p-4 shadow-sm space-y-3 w-full">
          <div class="flex items-center justify-between pb-1.5 border-b border-slate-100 text-xs text-slate-500">
            <div class="flex items-center gap-1.5 font-semibold ${isF ? 'text-pink-600' : 'text-indigo-600'}">
              <span>${agent.display} 튜터</span><span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-normal">${appState.lang.name}</span>
            </div>
            <span class="text-[10px] text-slate-400">${appState.scenario} 모드</span>
          </div>
      `;

      if (data.coaching && data.coaching.isNeeded) {
        html += `
          <div class="bg-amber-50/70 border border-amber-200 rounded-xl p-3.5 space-y-2">
            <div class="flex items-center gap-1.5 text-amber-800 font-bold text-xs"><i class="fa-regular fa-lightbulb"></i><span>이렇게 말해보세요!</span></div>
            <div class="flex items-center justify-between gap-2 bg-white/80 p-2 rounded-lg border border-amber-100">
              <span class="text-sm md:text-base font-bold text-slate-800">${escapeHtml(data.coaching.recommendedPhrase)}</span>
              <button onclick="speakText('${data.coaching.recommendedPhrase.replace(/'/g, "\\'")}', '${appState.lang.code}', this)" class="flex items-center gap-1 bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded-md text-xs font-medium transition shadow-sm cursor-pointer">
                <i class="fa-solid fa-volume-high"></i><span>${appState.speechRate}x</span>
              </button>
            </div>
            ${data.coaching.pronunciationGuide ? `<div class="text-xs text-amber-900/80"><span class="font-semibold text-amber-800">🗣️ 팁:</span> ${escapeHtml(data.coaching.pronunciationGuide)}</div>` : ''}
            ${data.coaching.explanation ? `<div class="text-xs text-slate-600 leading-relaxed bg-white/50 p-2 rounded-md">${escapeHtml(data.coaching.explanation)}</div>` : ''}
          </div>
        `;
      }

      if (data.foreignText) {
        html += `
          <div class="space-y-2">
            <div class="flex items-start justify-between gap-3">
              <p class="text-sm md:text-base text-slate-800 leading-relaxed font-medium">${escapeHtml(data.foreignText)}</p>
              <button onclick="speakText('${data.foreignText.replace(/'/g, "\\'")}', '${appState.lang.code}', this)" class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-xl transition cursor-pointer flex-shrink-0">
                <i class="fa-solid fa-volume-high text-base"></i>
              </button>
            </div>
            ${data.koreanTranslation ? `<div class="text-xs"><details class="cursor-pointer group"><summary class="text-slate-400 hover:text-indigo-600 text-[11px] font-medium list-none flex items-center gap-1"><span>한국어 해석 보기/숨기기</span> <i class="fa-solid fa-chevron-down group-open:rotate-180 transition"></i></summary><div class="mt-1 p-2 bg-slate-50 text-slate-600 rounded-lg border border-slate-100 leading-relaxed">${escapeHtml(data.koreanTranslation)}</div></details></div>` : ''}
          </div>
        `;
      }

      if (data.correctionTip) {
        html += `<div class="text-xs bg-indigo-50/60 border border-indigo-100 rounded-xl p-2.5 text-indigo-900 flex items-start gap-2"><i class="fa-solid fa-check-double text-indigo-500 mt-0.5"></i><div><strong class="font-semibold">교정 팁:</strong> ${escapeHtml(data.correctionTip)}</div></div>`;
      }

      html += `</div>`;
      div.innerHTML = html;
      c.appendChild(div);
      c.scrollTop = c.scrollHeight;
      
      const ttsText = (data.coaching && data.coaching.isNeeded) ? data.coaching.recommendedPhrase : data.foreignText;
      if (ttsText) speakText(ttsText, appState.lang.code);
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    async function requestGeminiCoaching(userText) {
      if (!appState.apiKey) throw new Error('API_KEY_REQUIRED');

      const agent = getCurrentAgent();
      const sys = `당신은 사용자의 실시간 외국어 회화 튜터이자 한국어 표현 코치입니다.
이름: '${agent.name}' (${appState.lang.name} 원어민 튜터)
대화 언어: ${appState.lang.name}
규칙:
1. 사용자가 한국어로 질문하면 coaching.isNeeded=true 로 설정하고 recommendedPhrase, pronunciationGuide, explanation(한국어)을 채우고, foreignText에는 대화를 이어가는 질문 작성.
2. 사용자가 외국어로 말하면 원어민 친구처럼 답변(foreignText)하고 koreanTranslation을 작성. 어색하면 correctionTip에 교정. coaching.isNeeded=false.
반드시 지정된 JSON 스키마로 응답하세요.`;

      const contents = appState.history.slice(-appState.contextTurns).map(t => ({ role: t.role, parts: [{ text: t.text }] }));
      contents.push({ role: 'user', parts: [{ text: userText }] });

      const payload = {
        contents: contents,
        systemInstruction: { parts: [{ text: sys }] },
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              "isKoreanInput": { "type": "BOOLEAN" },
              "foreignText": { "type": "STRING" },
              "koreanTranslation": { "type": "STRING" },
              "coaching": {
                "type": "OBJECT",
                "properties": {
                  "isNeeded": { "type": "BOOLEAN" },
                  "recommendedPhrase": { "type": "STRING" },
                  "pronunciationGuide": { "type": "STRING" },
                  "explanation": { "type": "STRING" }
                }
              },
              "correctionTip": { "type": "STRING" }
            }
          }
        }
      };

      // ✨ [수정 완료]: 2026년 기준 404 에러가 나지 않는 가장 최신의 공식 모델명으로 변경했습니다.
      const candidateModels = ['gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash'];
      let lastErr = '';

      for (const model of candidateModels) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${appState.apiKey}`;
        try {
          const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (!res.ok) {
            const txt = await res.text();
            let msg = txt; try { msg = JSON.parse(txt).error.message; } catch(e){}
            if (res.status === 400 || res.status === 403) throw new Error(`[권한/요청 오류] ${msg}`);
            lastErr = `[${model}] ${res.status}: ${msg}`;
            continue;
          }
          const data = await res.json();
          return JSON.parse(data.candidates[0].content.parts[0].text);
        } catch (e) {
          if (e.message.includes('권한/요청 오류')) throw e;
          lastErr = e.message;
        }
      }
      throw new Error(lastErr || '모든 최신 모델 응답에 실패했습니다.');
    }

    window.handleSubmitMessage = async function() {
      const inputEl = document.getElementById('textInput');
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      appendUserMessage(text);
      appState.history.push({ role: 'user', text: text });

      const typingId = createTypingIndicator();
      document.getElementById('sendBtn').disabled = true;

      try {
        const res = await requestGeminiCoaching(text);
        removeTypingIndicator(typingId);
        appendAiResponse(res);
        appState.history.push({ role: 'model', text: res.foreignText });
      } catch (err) {
        removeTypingIndicator(typingId);
        if (err.message === 'API_KEY_REQUIRED') {
          appendSystemMessage('⚠️ 설정(⚙️)을 열고 Gemini API Key를 입력해 주세요.');
          openSettings();
        } else {
          appendSystemMessage(`⚠️ <strong>통신 오류가 발생했습니다:</strong><br><span class="font-mono text-[10px] text-red-500 break-all">${escapeHtml(err.message)}</span><br><br>※ API 키 설정 또는 일일 한도를 다시 확인해주세요.`);
        }
      } finally {
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('textInput').focus();
      }
    };

    window.clearAllChat = function() {
      document.getElementById('chatContainer').innerHTML = '';
      appState.history = [];
      appendSystemMessage('대화가 초기화되었습니다. 새로운 회화를 시작하세요!');
    };

    window.addEventListener('click', (e) => {
      const modal = document.getElementById('settingsModal');
      if (modal && e.target === modal) closeSettings();
    });

    document.addEventListener('DOMContentLoaded', () => {
      initSpeechRecognition();
      updateHeaderBadge();
      updateTutorUI();
      const agent = getCurrentAgent();
      appendAiResponse({
        foreignText: `Hello! I'm ${agent.name}, your conversation tutor. Feel free to chat in English or ask me anything in Korean whenever you get stuck!`,
        koreanTranslation: `안녕하세요! 회화 튜터 ${agent.display}입니다. 편하게 말해보고 막힐 땐 한국어로 물어보세요!`,
        coaching: { isNeeded: false }
      });
    });
  </script>
</body>
</html>
